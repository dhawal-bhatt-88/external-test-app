# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit configuration for external-test-app
# What this repo is: a test "host" app for the @yourco/forms package (vendored as .tgz).
#   - src/            React 19 + TypeScript + Vite host app (drafts, device keys, submit)
#   - server/         Local Express 5 test API (submit, drafts, draft-key, fault injection)
#   - src/demo/       MSW in-browser mock of the same API, used for the GitHub Pages build
#   - src/forms/      Form schema fixtures (JSON)

language: "en-GB"
tone_instructions: "Be concise. Prioritise correctness, contract drift and security over style nitpicks."
early_access: false

reviews:
  profile: "chill"                  # switch to "assertive" for stricter reviews
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: false
  sequence_diagrams: true
  poem: false

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
    ignore_title_keywords:
      - "WIP"
      - "[skip review]"

  # Skip generated, vendored and binary files
  path_filters:
    - "!**/node_modules/**"
    - "!dist/**"
    - "!package-lock.json"
    - "!*.tgz"
    - "!public/mockServiceWorker.js"   # generated by `msw init`
    - "!src/assets/**"
    - "!server/drafts.json"
    - "!server/submissions.json"
    - "!**/*.log"

  path_instructions:
    # ---------- Cross-cutting ----------
    - path: "**/*"
      instructions: |
        - This is a TEST HARNESS for @yourco/forms, not a production app. Deliberate test-only behaviour
          (fault-injection endpoints, user taken from the query string, dev-only default secrets, the
          `keyAs` override) is intended — do not flag it as a bug unless it can leak into a real
          deployment or the comment explaining it is missing/wrong.
        - Flag any real secret, token or credential. A default secret is only acceptable if it is clearly
          named dev-only and overridable via an environment variable.
        - Comments in this repo explain *why*; flag comments that no longer match the code.

    # ---------- React host app ----------
    - path: "src/**/*.{ts,tsx}"
      instructions: |
        - Strict TypeScript: no `any`; avoid `as unknown as X` casts unless a comment justifies them.
        - Hooks must follow the rules of hooks; effects that fetch must handle unmount/races
          (the `let current = true` pattern or AbortController) and have correct dependency arrays.
        - Every fetch must check `response.ok` and surface errors to the user or onDraftProblem/onError.
        - API URLs must be built via `apiUrl()` so they work under the Vite base (/external-test-app/).
        - Always encodeURIComponent query-string values.
        - Web Crypto: keys imported as non-extractable, AES-GCM 256; never log or render key material.
        - Draft scope must include both user and patient; logout must clear the user's device drafts.
        - Keep the host realistic: changes should exercise the public @yourco/forms API
          (@yourco/forms/react, /core), not its internals.
        - Accessibility: form controls have labels, landmarks/aria-labels on regions, keyboard operable buttons.

    - path: "src/main.tsx"
      instructions: |
        - MSW must only be imported dynamically behind `import.meta.env.VITE_DEMO === 'true'` so it is
          tree-shaken out of normal builds, and the demo API must start before the first render.

    # ---------- Contract parity: server <-> demo mock ----------
    - path: "server/index.mjs"
      instructions: |
        - src/demo/handlers.ts is a mirror of this file. Any change to routes, request validation,
          status codes, response shapes, idempotency/dedup or fault flags MUST have a matching change
          in src/demo/handlers.ts — flag the PR if it does not.
        - Submit flow order matters: fault flags consumed → shape check (400) → idempotency dedup
          (before schema checks) → schema load (500) → prepareSubmission (422) → store (201) / duplicate (200).
        - Only answers returned by prepareSubmission may be stored; hidden/unknown answers must be stripped.
        - Version mismatch is accepted and flagged, never rejected.
        - File writes must stay atomic (write tmp then rename). Logging failures must never break a request.
        - Use reply() for submit responses so late responses to disconnected clients are still logged.
        - Validate and bound all query/body inputs (e.g. numbers finite and non-negative).
        - Never log secrets or derived keys; request logs may contain test answers only.

    - path: "src/demo/**/*.ts"
      instructions: |
        - Must behave the same as server/index.mjs: same routes, checks, status codes and response
          shapes. Flag any divergence, and flag server changes not reflected here (and vice versa).
        - All localStorage keys must use the `external-test-app:demo:` prefix (github.io shares one origin);
          reads must tolerate missing/corrupt JSON.
        - The demo is explicitly insecure (secret ships in the bundle); keep the warning comment and the
          on-screen demo banner intact.

    # ---------- Form schema fixtures ----------
    - path: "src/forms/**/*.json"
      instructions: |
        - Fixtures must pass assertSchemaIntegrity: unique block ids, every reference (conditions, pages)
          points to an existing id, formId and formVersionId present.
        - formId must be unique across all fixtures (server and demo look schemas up by formId).
        - When a fixture is edited, check whether formVersionId should change.
        - No real patient or personal data — use obviously fake values.

    # ---------- Dependencies & build ----------
    - path: "package.json"
      instructions: |
        - @yourco/forms is consumed from a local .tgz; when its version changes, confirm the matching .tgz
          is committed and old unused tarballs are removed.
        - Runtime-only deps in `dependencies`, tooling/test server deps (express, msw, concurrently) in `devDependencies`.

    - path: "vite.config.ts"
      instructions: |
        - `base` must stay in sync with the GitHub Pages path and src/api.ts; the dev proxy must keep
          working for both `${base}api` and `/api`.

    - path: ".github/workflows/**"
      instructions: |
        - Minimal `permissions:`; pin action major versions (or SHAs); run `npm run lint` and `npm run build`
          before deploy; Pages build must set VITE_DEMO=true.

  tools:
    gitleaks:
      enabled: true
    actionlint:
      enabled: true
    markdownlint:
      enabled: true
    yamllint:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: "local"
